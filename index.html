<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Registration Portal</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <div class="container py-5">


        <!-- =========================
             FORM CARD
        ========================== -->

        <div class="row justify-content-center">

            <div class="col-12 col-lg-9">

                <div class="card shadow">

                    <div class="card-body p-4 p-md-5">


                        <!-- =========================
                             HEADING
                        ========================== -->

                        <div class="text-center mb-4">

                            <h1>
                                Student Registration
                            </h1>

                            <p class="text-secondary">
                                Create your student profile
                            </p>

                        </div>


                        <form>


                            <!-- =========================
                                 1. NAME
                            ========================== -->

                            <h5 class="mb-3">
                                Personal Information
                            </h5>


                            <div class="row">


                                <!-- First Name -->

                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="firstName"
                                        class="form-label">

                                        First Name

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="firstName"
                                        placeholder="Enter first name"
                                        required>

                                </div>


                                <!-- Last Name -->

                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="lastName"
                                        class="form-label">

                                        Last Name

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="lastName"
                                        placeholder="Enter last name"
                                        required>

                                </div>

                            </div>



                            <!-- =========================
                                 2. EMAIL + PHONE
                            ========================== -->

                            <div class="row">


                                <!-- Email -->

                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="email"
                                        class="form-label">

                                        Email Address

                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        placeholder="example@gmail.com"
                                        required>

                                    <div class="form-text">

                                        We will use this email for
                                        communication.

                                    </div>

                                </div>


                                <!-- Phone -->

                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="phone"
                                        class="form-label">

                                        Phone Number

                                    </label>

                                    <input
                                        type="tel"
                                        class="form-control"
                                        id="phone"
                                        placeholder="9876543210"
                                        required>

                                </div>

                            </div>



                            <!-- =========================
                                 3. PASSWORD
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    minlength="8"
                                    placeholder="Create password"
                                    required>

                                <div class="form-text">

                                    Password must contain
                                    at least 8 characters.

                                </div>

                            </div>



                            <!-- =========================
                                 4. LARGE INPUT
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="displayName"
                                    class="form-label">

                                    Display Name

                                </label>

                                <input
                                    type="text"
                                    class="form-control form-control-lg"
                                    id="displayName"
                                    placeholder="Large Bootstrap input">

                            </div>



                            <!-- =========================
                                 5. SMALL INPUT
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="studentCode"
                                    class="form-label">

                                    Student Code

                                </label>

                                <input
                                    type="text"
                                    class="form-control form-control-sm"
                                    id="studentCode"
                                    placeholder="Small Bootstrap input">

                            </div>



                            <!-- =========================
                                 6. DATE + TIME
                            ========================== -->

                            <div class="row">


                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="dob"
                                        class="form-label">

                                        Date of Birth

                                    </label>

                                    <input
                                        type="date"
                                        class="form-control"
                                        id="dob">

                                </div>


                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="preferredTime"
                                        class="form-label">

                                        Preferred Counseling Time

                                    </label>

                                    <input
                                        type="time"
                                        class="form-control"
                                        id="preferredTime">

                                </div>

                            </div>



                            <!-- =========================
                                 7. NUMBER
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="age"
                                    class="form-label">

                                    Age

                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="age"
                                    min="15"
                                    max="60"
                                    placeholder="Enter your age">

                            </div>



                            <!-- =========================
                                 8. GENDER - RADIO
                            ========================== -->

                            <div class="mb-3">

                                <label class="form-label d-block">

                                    Gender

                                </label>


                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="male"
                                        value="male">

                                    <label
                                        class="form-check-label"
                                        for="male">

                                        Male

                                    </label>

                                </div>


                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="female"
                                        value="female">

                                    <label
                                        class="form-check-label"
                                        for="female">

                                        Female

                                    </label>

                                </div>


                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="other"
                                        value="other">

                                    <label
                                        class="form-check-label"
                                        for="other">

                                        Other

                                    </label>

                                </div>

                            </div>



                            <!-- =========================
                                 9. COURSE - SELECT
                            ========================== -->

                            <div class="row">


                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="course"
                                        class="form-label">

                                        Course

                                    </label>

                                    <select
                                        class="form-select"
                                        id="course"
                                        required>

                                        <option selected disabled>
                                            Select your course
                                        </option>

                                        <option>
                                            B.Tech CSE
                                        </option>

                                        <option>
                                            BCA
                                        </option>

                                        <option>
                                            MCA
                                        </option>

                                        <option>
                                            BBA
                                        </option>

                                    </select>

                                </div>



                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="semester"
                                        class="form-label">

                                        Semester

                                    </label>

                                    <select
                                        class="form-select"
                                        id="semester">

                                        <option selected>
                                            Select semester
                                        </option>

                                        <option>
                                            Semester 1
                                        </option>

                                        <option>
                                            Semester 2
                                        </option>

                                        <option>
                                            Semester 3
                                        </option>

                                        <option>
                                            Semester 4
                                        </option>

                                        <option>
                                            Semester 5
                                        </option>

                                        <option>
                                            Semester 6
                                        </option>

                                    </select>

                                </div>

                            </div>



                            <!-- =========================
                                 10. SKILLS - CHECKBOX
                            ========================== -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Technical Skills

                                </label>


                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="html"
                                        value="html">

                                    <label
                                        class="form-check-label"
                                        for="html">

                                        HTML

                                    </label>

                                </div>


                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="css"
                                        value="css">

                                    <label
                                        class="form-check-label"
                                        for="css">

                                        CSS

                                    </label>

                                </div>


                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="javascript"
                                        value="javascript">

                                    <label
                                        class="form-check-label"
                                        for="javascript">

                                        JavaScript

                                    </label>

                                </div>


                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="react"
                                        value="react">

                                    <label
                                        class="form-check-label"
                                        for="react">

                                        React

                                    </label>

                                </div>

                            </div>



                            <!-- =========================
                                 11. INPUT GROUP
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="github"
                                    class="form-label">

                                    GitHub Username

                                </label>


                                <div class="input-group">

                                    <span class="input-group-text">
                                        github.com/
                                    </span>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="github"
                                        placeholder="username">

                                </div>

                            </div>



                            <!-- =========================
                                 12. STIPEND EXPECTATION
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="salary"
                                    class="form-label">

                                    Expected Stipend

                                </label>


                                <div class="input-group">

                                    <span class="input-group-text">
                                        ₹
                                    </span>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="salary"
                                        placeholder="Enter amount">

                                    <span class="input-group-text">
                                        / month
                                    </span>

                                </div>

                            </div>



                            <!-- =========================
                                 13. ADDRESS
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="address"
                                    class="form-label">

                                    Address

                                </label>

                                <textarea
                                    class="form-control"
                                    id="address"
                                    rows="4"
                                    placeholder="Enter your complete address">
                                </textarea>

                            </div>



                            <!-- =========================
                                 14. STATE
                            ========================== -->

                            <div class="row">


                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="state"
                                        class="form-label">

                                        State

                                    </label>

                                    <select
                                        class="form-select"
                                        id="state">

                                        <option selected>
                                            Select State
                                        </option>

                                        <option>
                                            Uttar Pradesh
                                        </option>

                                        <option>
                                            Delhi
                                        </option>

                                        <option>
                                            Maharashtra
                                        </option>

                                        <option>
                                            Karnataka
                                        </option>

                                        <option>
                                            Rajasthan
                                        </option>

                                    </select>

                                </div>


                                <div class="col-12 col-md-6 mb-3">

                                    <label
                                        for="city"
                                        class="form-label">

                                        City

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="city"
                                        placeholder="Enter city">

                                </div>

                            </div>



                            <!-- =========================
                                 15. FILE UPLOAD
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="resume"
                                    class="form-label">

                                    Upload Resume

                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    id="resume">

                                <div class="form-text">

                                    Upload PDF or DOC file.

                                </div>

                            </div>



                            <!-- =========================
                                 16. PROFILE PHOTO
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="photo"
                                    class="form-label">

                                    Profile Photo

                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    id="photo">

                            </div>



                            <!-- =========================
                                 17. FLOATING LABEL
                            ========================== -->

                            <div class="form-floating mb-3">

                                <input
                                    type="text"
                                    class="form-control"
                                    id="linkedin"
                                    placeholder="LinkedIn">

                                <label for="linkedin">

                                    LinkedIn Profile

                                </label>

                            </div>



                            <!-- =========================
                                 18. VALIDATION EXAMPLE
                            ========================== -->

                            <div class="mb-3">

                                <label
                                    for="validExample"
                                    class="form-label">

                                    Validation Example

                                </label>

                                <input
                                    type="text"
                                    class="form-control is-valid"
                                    id="validExample"
                                    value="Everything looks good">

                                <div class="valid-feedback">

                                    Looks good!

                                </div>

                            </div>



                            <div class="mb-3">

                                <label
                                    for="invalidExample"
                                    class="form-label">

                                    Validation Example

                                </label>

                                <input
                                    type="text"
                                    class="form-control is-invalid"
                                    id="invalidExample"
                                    value="">

                                <div class="invalid-feedback">

                                    Please enter a valid value.

                                </div>

                            </div>



                            <!-- =========================
                                 19. NOTIFICATIONS SWITCH
                            ========================== -->

                            <div class="mb-4">

                                <div class="form-check form-switch">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="notifications"
                                        checked>

                                    <label
                                        class="form-check-label"
                                        for="notifications">

                                        Receive email notifications

                                    </label>

                                </div>

                            </div>



                            <!-- =========================
                                 20. TERMS
                            ========================== -->

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="terms">

                                    I agree to the
                                    terms and conditions.

                                </label>

                            </div>



                            <!-- =========================
                                 21. BUTTONS
                            ========================== -->

                            <div class="d-flex gap-2">

                                <button
                                    type="reset"
                                    class="btn btn-secondary">

                                    Reset

                                </button>


                                <button
                                    type="submit"
                                    class="btn btn-primary flex-grow-1">

                                    Register Student

                                </button>

                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
